# Maintainer overrides for the conformance-test tool (tests/iot-test-tool,
# run_sequences.py --overrides tests/conformance).
#
# This file is written BY HAND. The project's own choices (variable values,
# rows switched on or off, changed fields, rows inserted/deleted/moved) are
# in overrides.project.yaml beside it, GENERATED by the web GUI from its
# working copies and settings ("Export overrides" / "Write overrides").
# Both are loaded together; this file wins where both set a variable.
#
# Keyed by TestCase.qualified_name = "<collection>::<suite>::<case name>",
# exactly as the test tool's run records and GUI show it, or as
# EittProject.iter_test_cases() yields it. Copy the
# name exactly (including trailing spaces some XML authors left in) —
# fixtures.py's dynamic collection warns loudly about any override key
# that never matches a real TestCase, so a typo here is never silent.
#
# action: trigger
#   The XML step needs a human to push a button / cause an event the
#   tool can't request over CoAP. Call a DUT test-only control endpoint
#   instead (see runtime_test_server.c and fixtures.py for what's
#   actually registered). `params` is a dict CBOR-encoded as the POST
#   body.
#
# action: skip
#   Excluded from collection with a visible reason (pytest.skip) — use
#   for steps with no automated substitute yet.
#
# action: xfail
#   Runs, but a failure doesn't fail the suite (pytest.xfail) — use for
#   known-flaky or known-blocked telegrams.
#
# The special "variables:" key (NOT a TestCase name) is the variable
# layer EITT applies on top of the read-only template's Fields defaults:
# its variable-values JSON (GLOBAL -> test-suite -> per-collection), plus
# any later operator edit pushed into an already-generated copy. Put a
# value here when the template's shipped default is NOT what a real run
# uses — see the "How EITT generates a runnable test" section of
# tests/iot-test-tool/docs/xml-interpreter.md.
#
# The special "message_attributes:" key (NOT a TestCase name either) corrects
# a corrupt ATTRIBUTE VALUE of one message over the read-only master template.
# Where "message_activation:" below records the operator's CHOICE between two
# alternative branches, this records template DATA CORRUPTION: a value that is
# simply wrong and that the template — which must never be edited — cannot be
# fixed in. Keyed the same way (case name + the message's XML ID, with `index`
# for a duplicate ID); `set` maps XML attribute names to their corrected
# values, and `reason` is mandatory. Only attribute names the interpreter
# actually maps onto a CoAPMessage field are accepted (AcceptedCF, CF /
# ContentFormat) — anything else is a load-time error, so a typo here can
# never be a silent no-op. An entry that matches no message is a hard error
# at collection time, exactly as for message_activation.

variables:
  # The template default is the JSON's unfilled operator placeholder,
  # "C:/path/to/file.bin" — a Windows path that cannot exist inside the
  # Linux test container. Point it at the dummy firmware image in the test
  # tool's data/ instead. Relative to the repo root, which is the working
  # directory the runs start in (/w in run-in-docker.ps1); the tool also
  # finds it relative to its own folder.
  PREP_UPDATE_FILE_PATH: tests/iot-test-tool/data/FWUUploadDummySmall.bin

  # 5.2.6.1 / 5.2.7.1b GET /dev/hwt and match the hardware type. The
  # template default is "Windows" (the platform the reference run used);
  # this stack also runs on Linux (CI, Docker). 5.2.6.1 checks it with
  # "/value: #5_2_6_1_HARDWARE_TYPE", a regular expression, so "|" gives
  # alternatives there. 5.2.7.1b plans a literal JSON answer
  # ({ "value": "#5_2_7_1b_INITIAL_HARDWARE_TYPE" }), which EITT - and the
  # tool - compare exactly: it names the platform the tests run on (Linux
  # in CI and Docker; set "Windows" for a run against the Windows build).
  5_2_6_1_HARDWARE_TYPE: "Windows|Linux"
  5_2_7_1b_INITIAL_HARDWARE_TYPE: "Linux"

  # 5.2.9.1 waits these after the software update package is downloaded and
  # after the update is triggered. "Manufacturer must declare"; the template
  # defaults are 60 s and 120 s. runtime_test_server only simulates the
  # update: the download is done when its last block arrives, the update
  # completes 2 s after the trigger (swu_upgrade_complete_cb). In ms.
  SWU_WAIT_AFTER_DOWNLOAD: 1000
  SWU_WAIT_AFTER_UPDATE: 5000

"5.3. Security::5.3.14 PUT /{base-path}/auth/o/replwdo (Optional)::5.3.14.1. Set the replay window size":
  action: skip
  reason: "Optional feature (suite title '(Optional)', template Hitem V34 'marked as optional') not implemented by the stack (no PUT handler, oc_knx_sec.c, OSCORE_REPLAY_WINDOW_SIZE fixed at 32); the reference certification run never executed it either (traces/5_3.xml contains GETs to auth/o/replwdo but no PUT)"

# --- Accepted response-code substitutions ------------------------------------
# Where a test PLANS one error code but the device answers another, and the
# certification body accepts it. Per the Tests Spec / KSG "IoT" class meeting
# of 2025.12.12: where a test asks for "Unauthorized", a device answering
# "Forbidden" is also correct.
#
# This is not a shortcut to make tests pass — it is recorded in the reference
# certification runs themselves, which were ACCEPTED with these very
# evaluations present:
#   tests/iot-test-tool/tests/fixtures/reference-traces/5_3.xml    x5  "Message code differs, planned: 4.01, received: 4.03"
#   tests/iot-test-tool/tests/fixtures/reference-traces/5_4_1.xml  x1  "Message code differs, planned: 4.00, received: 4.03"
#
# Global rather than per-TestCase on purpose: it is a property of how this
# device reports authorization errors, not of any single test. (EITT's own
# telegram NUMBERS, which the certification notes use to point at the affected
# steps, do not survive template regeneration — see the project notes.)
#
# Without this the code assertion added for finding F1 fails 5.2.2.1 step 2 at
# the point where it checks that a post-factory-reset request is rejected; that
# failure then prevents the following @#"Copy of AUTH PREPARATION" from running
# and cascades into 17 further failures.
accepted_response_codes:
  "4.01": ["4.03"]   # Unauthorized planned, Forbidden accepted
  "4.00": ["4.03"]   # Bad Request planned, Forbidden accepted (traces/5_4_1.xml)

# --- 5.4.2: out of scope, whole suite ----------------------------------------
# "5.4.2. GET & OBSERVE /.knx" is labelled "(Preliminary - Not for Certification)"
# in the template's own suite name. The device's /k Observe path is correct
# (tests/runtime/test_observe.py covers it). What keeps the suite skipped is on
# the interpreter's side: its request path does not send the CoAP Observe option
# (the F6 gate fails an Observe row rather than sending a plain GET), and
# 5.4.2.2's Step 2 provokes a read (st:r) where the expected notification needs a
# write (st:w), which is a template flaw the attribute overrides cannot correct
# because it sits in the CBOR body. Lifting the skip needs Observe support in
# the interpreter plus a body-level correction for 5.4.2.2.
#
# 'skip' rather than 'xfail' on purpose: xfail would run them anyway (~2 min of
# Observe timeouts) and 5.4.2.2d actually PASSES, so it would report XPASS and
# reintroduce exactly the clutter this is meant to remove. Skip states the real
# situation — the section is out of scope — and covers all 7 uniformly.
#
# REMOVE these once the interpreter sends Observe and 5.4.2.2's Step 2 is corrected; the section then wants a real run.

"5.4. Messaging::5.4.2. GET & OBSERVE /.knx  (Preliminary - Not for Certification)::5.4.2.1. Read the last sent S-Mode Message":
  action: skip
  reason: "5.4.2 out of scope — 'Preliminary - Not for Certification', Observe option not implemented in the interpreter's request path; 5.4.2.2 additionally has a template flaw (read provoked where a write is expected)"

"5.4. Messaging::5.4.2. GET & OBSERVE /.knx  (Preliminary - Not for Certification)::5.4.2.2. Observe all outgoing S-Mode Messages":
  action: skip
  reason: "5.4.2 out of scope — 'Preliminary - Not for Certification', Observe option not implemented in the interpreter's request path; 5.4.2.2 additionally has a template flaw (read provoked where a write is expected)"

"5.4. Messaging::5.4.2. GET & OBSERVE /.knx  (Preliminary - Not for Certification)::5.4.2.2b. Deregister observation to S-Mode communication":
  action: skip
  reason: "5.4.2 out of scope — 'Preliminary - Not for Certification', Observe option not implemented in the interpreter's request path; 5.4.2.2 additionally has a template flaw (read provoked where a write is expected)"

"5.4. Messaging::5.4.2. GET & OBSERVE /.knx  (Preliminary - Not for Certification)::5.4.2.2c. Delete observation to S-Mode communication":
  action: skip
  reason: "5.4.2 out of scope — 'Preliminary - Not for Certification', Observe option not implemented in the interpreter's request path; 5.4.2.2 additionally has a template flaw (read provoked where a write is expected)"

"5.4. Messaging::5.4.2. GET & OBSERVE /.knx  (Preliminary - Not for Certification)::5.4.2.2d. Ensure that Notifications are confirmable per default":
  action: skip
  reason: "5.4.2 out of scope — 'Preliminary - Not for Certification'. NOTE: this one currently PASSES (only 3 active messages, no real Observe); skipped only to keep the suite's scope consistent"

"5.4. Messaging::5.4.2. GET & OBSERVE /.knx  (Preliminary - Not for Certification)::5.4.2.2e. Non-Confirmable Notifications can be requested":
  action: skip
  reason: "5.4.2 out of scope — 'Preliminary - Not for Certification', Observe option not implemented in the interpreter's request path; 5.4.2.2 additionally has a template flaw (read provoked where a write is expected)"

"5.4. Messaging::5.4.2. GET & OBSERVE /.knx  (Preliminary - Not for Certification)::5.4.2.3. Invalid Observe for S-Mode without setting the lifetime parameter":
  action: skip
  reason: "5.4.2 out of scope — 'Preliminary - Not for Certification', Observe option not implemented in the interpreter's request path; 5.4.2.2 additionally has a template flaw (read provoked where a write is expected)"

# --- 5.10: two failures that are properties of the TEST SETUP, not the DUT ---
# Both are xfail (run, report, don't fail the suite) rather than skip, so if
# the underlying condition ever changes pytest reports XPASS instead of
# silently continuing to hide a real regression.

"5.10 Generic test cases::5.10.1 GET pagination::5.10.1.2 Pagination via a GET specifying the Page Number pn and the Page Size ps":
  action: xfail
  reason: >-
    Multi-IPv6 deviation, accepted by the certification body (agreed
    25 Sept 2025: a HW must have at least ONE IPv6 address, not necessarily
    more). The dev/ipv6 ps=2 / ps=3 telegrams ask for a second and third
    address ('/1/value', '/2/value'); this DUT has exactly one, the veth ULA
    fd11:9988:7766::1 that tests/common/tools/run-in-docker.ps1 assigns. Fails with
    "field '/1/value' not present in response". The certification run hit the
    same wall from the other side: traces/5_10.xml records
    "Cannot find JSON pointer: /2/value" on ps=3 — the ONLY non-OK evaluation
    in the whole of 5.10. Everything else in this TestCase (the fp/g, fp/r,
    fp/p, p, auth and auth/at pagination pairs) passes.

"5.10 Generic test cases::5.10.1 GET pagination::5.10.1.1 Pagination via a GET specifying the Page Number pn":
  action: xfail
  reason: >-
    Test-scaffolding artifact, the same as 5.10.1.4: GET /p lists the four
    /test/* control endpoints this build registers (restart, factory-reset,
    trigger, sleep-period) besides the five datapoints, and EITT's
    link-format rule - every returned link must match one of the planned
    lines [parity:P-0045] - fails on
    </test/restart>. A device without the test endpoints answers exactly
    the five planned links.

"5.10 Generic test cases::5.10.1 GET pagination::5.10.1.4 List Metadata Query Parameter l":
  action: xfail
  reason: >-
    Test-scaffolding artifact, not a device or stack fault. The step asserts
    "</p>;total=5" for the five datapoints /p/1../p/4 + /p/p1. GET /p counts
    every entry on the application-resource chain (oc_knx_p.c: the total loop
    accepts anything with a URI), and this build additionally registers the
    four /test/* control endpoints from api/oc_test_control.c that the Python
    suite needs to drive the device (restart, factory-reset, trigger,
    sleep-period) — so the device answers total=9. The certified BDUT
    (eitt_virtual_gui) has the same endpoints behind #ifdef KNX_TEST_CONTROL
    and reports total=5 with them compiled out; traces/5_10.xml confirms
    "</p>;total=5". Filtering them out in oc_knx_p.c was implemented and then
    REVERTED deliberately: it puts test-awareness into production stack code.
    The clean fix is to stop registering /test/* on the application-resource
    chain (or build them out for the run) — until then this stays xfail.
    Note the /fp/g, /fp/r, /fp/p l=total assertions in this same TestCase all
    pass: they count their own tables, not the app-resource chain.




# --- Manual-interaction steps (Cycles="*" / "trigger device manually") ---
# Placeholder — fill in the real qualified name + /test/trigger params
# once the 5.4 Messaging collection's multicast-trigger TestCases are
# validated end-to-end against this XML revision. The runner already
# triggers the sensor itself where the pairing is unambiguous — see
# _trigger_sensor in interpreter/runner.py.

# --- Formerly xfailed here: 5.3.1.4b / .4c / .4d -------------------------
# REMOVED 2026-07-26 after checking the template and the trace, per the
# check-template-then-trace rule. They were marked
# "BLOCKED:timer - SPAKE2+ handover timing not implemented in stack", which
# was wrong on both counts:
#   * 5.3.1.4b and 5.3.1.4c contain NO CoAPMessages at all — just two title
#     comments. They are empty placeholders the CreationMessage expects the
#     tester to fill in per project, so there is no handover and no timer to
#     block on.
#   * 5.3.1.4d contains only a factory reset ({"cmd":"reset","value":2}) plus
#     its 2.04 — again no SPAKE2+ handover.
# traces/5_3.xml agrees: the reference certification run recorded 0
# CoAPMessages for .4b and .4c, and only 2 TelNo'd messages for .4d, while
# .4a (the one variant with real content) ran 18 messages all "OK".
# Verified by removing them: section 5.3 stays 44 passed / 1 skipped.
# The stack genuinely does not implement handover (oc_knx.c:45 "SPAKE_PW = 8,
# // for device handover, not implemented yet") — but that is untested by
# these three, so an xfail here asserted a gap the suite never exercises.

# --- @@ / @@! operator prompts -> DUT control endpoints -------------------
# `@@!<text>` is EITT's "display comment in toolbar, SUSPEND EVALUATION and
# beep" command (EITT_KnxCommentCommandsScheme.xml) — a modal the operator
# dismisses after doing something PHYSICAL that no CoAP request can express.
# Bare `@@<text>` is the same modal WITHOUT the beep, so both route here.
#
# Matched by TEXT, first match wins, because `@@` on its own says only "a
# human does something" — not what. The template has exactly 6 uses today
# (grep the template for '@@' after any XML update; note `@@[` is the
# unrelated provisioning-command prefix and is dispatched before these):
#   5.3.1.3 x2  @@!  real device actions   -> control endpoints below
#   5.2.9.1     @@!  human observation     -> nothing to do
#   5.2.10.1b   @@!  human observation     -> nothing to do
#   5.4.1.8 x2  @@   sensor trigger + ack  -> below
#
# An `@@`/`@@!` that matches NOTHING here is a hard failure, not a silent skip:
# the test would otherwise "pass" while the physical step it depends on
# never happened. That is exactly what used to occur — @@! was ignored
# entirely, so 5.3.1.3's SPAKE2+-after-power-cycle step actually ran against
# a device in the PREVIOUS state, and the two hardest reset types the
# TestCase exists to cover were never exercised.
manual_actions:
  # 5.3.1.3 "Power cycle the device (OFF ->ON), once the device is ready,
  # press OK to continue". /test/restart defers a full re-init (75 ms) so the
  # stack tears down and comes back up — the closest automatable equivalent
  # to yanking power. It does NOT erase storage; that is the next prompt.
  - match: "power[- ]?cycle"
    endpoint: "/test/restart"
    reason: "manual power cycle (OFF->ON) -> deferred full re-init"

  # 5.3.1.3 "Perform Local Master Reset, once the device is ready, press OK
  # to continue". A Local Master Reset wipes the device back to factory
  # state, which is what /test/factory-reset does (storage + AT/GO table
  # erase on the main loop).
  - match: "local master reset"
    endpoint: "/test/factory-reset"
    reason: "manual Local Master Reset -> factory state"

  # 5.2.9.1 / 5.2.10.1b "Please check LAST UPDATE value" — a pure human
  # OBSERVATION: the operator reads the value off the GUI and judges it.
  # Deliberately no endpoint, and nothing for us to assert either. In BOTH
  # TestCases this prompt is the LAST meaningful step — the only thing after
  # it is `{"cmd":"reset","value":2}` — so there are no later telegrams that
  # re-check the value on our behalf. This is therefore a real (if small)
  # coverage gap, not something the automation silently covers: the
  # surrounding SWU flow is exercised, the human's eyeball check is not.
  #
  # It could be automated with a GET of /swu/lastupdate compared against the
  # run's start time, but that ASSERTS SOMETHING THE TEMPLATE DOES NOT, so
  # it is left out rather than invented.
  - match: "check LAST UPDATE value"
    reason: "human observation only (operator reads the value) — nothing automatable, and no later telegram re-checks it"

  # 5.4.1.8 "Trigger sensor during next 10 seconds after pressing OK" and
  # "Test Finished, Press OK" — two bare `@@` prompts (same modal as `@@!`,
  # no beep). BOTH are acknowledge-only, deliberately WITHOUT an endpoint.
  #
  # It is tempting to map the first onto POST /test/trigger, the way
  # _trigger_sensor does for 5.4.1.15. That is WRONG here, and the reference
  # certification run proves it: in traces/5_4_1.xml the window between
  # `pahmcast"…join=true"` (element 1591) and `Setup: Set LSM to 'loaded'`
  # (1593) contains exactly ONE empty comment and NO telegram at all. The
  # real operator did not make the device send anything — this TestCase
  # asserts the device does NOT transmit while LSM is 'loading', so a
  # trigger here injects traffic the certification run never had.
  # (Measured: doing so took the suite from 177 passed to 23 failed and the
  # runtime from ~9 to ~33 minutes.)
  #
  # The 10-second `@[w` countdown between them is the window itself and is
  # honoured as an ordinary wait. The trace records TimeToNext=22:27:29.8 on
  # the telegram after the second prompt — the operator left the modal open
  # overnight — which confirms nothing downstream depends on its duration.
  - match: "trigger sensor during"
    reason: "operator presses a PHYSICAL sensor; the test asserts nothing is transmitted in loading state, and traces/5_4_1.xml records no telegram in this window — injecting /test/trigger would test the opposite"

  - match: "test finished"
    reason: "end-of-window acknowledgement only — no device action; the 'nothing was sent' check is the surrounding steps"


# ---------------------------------------------------------------------------
# message_attributes — corrupt attribute VALUES corrected over the read-only
# master template (which must NEVER be edited).
# ---------------------------------------------------------------------------
message_attributes:

  # 5.5.4.1's first GET fp/g/1 ships AcceptedCF="r" — not a Content-Format at
  # all, just the tail fragment of "application/cbor" that an editing accident
  # left behind in the template. The intended value is not a guess: the
  # certified reference run recorded EVERY GET fp/g/1 of this section with
  # AcceptedCF="application/cbor" (tests/iot-test-tool/tests/fixtures/reference-traces/5_5.xml, e.g. TelNo 9, 43, 67,
  # all "EvalResult=OK").
  #
  # It matters now because the interpreter stopped silently dropping
  # unparseable Content-Format/Accept values (finding F9): _content_format_code
  # raises MalformedXmlValue instead, so "r" now fails the TestCase loudly
  # rather than sending a GET with no Accept option and passing by accident.
  # Corrected here rather than in the XML because the master template is
  # read-only, and because a value edited into it would silently disappear on
  # the next template revision while this entry would loudly stop matching.
  #
  # The other two "r"-like fragments in the template (AcceptedCF="a") sit on
  # OUT rows, where AcceptedCF is never consumed, so they are deliberately not
  # listed.
  - case: '5.5.4.1. Delete Group Object via its Identifier'
    id: 3FFDAF04-5D79-4762-AF20-7B7673C7054B
    set:
      AcceptedCF: application/cbor
    reason: "template data corruption: AcceptedCF=\"r\" is a fragment of \"application/cbor\"; tests/iot-test-tool/tests/fixtures/reference-traces/5_5.xml records every GET fp/g/1 of the certified run with AcceptedCF=\"application/cbor\". Overridden rather than edited into the XML because the master template is read-only."


