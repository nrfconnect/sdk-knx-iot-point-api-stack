[pytest]
addopts = -s

# The runtime tier (tests/runtime/, hand-written, behaviour-named test
# modules) and the infrastructure it shares with the conformance runs:
#
#   tests/common/         fixtures.py, tools/, runtime_test_server.c
#   tests/iot-test-tool/  the conformance-test tool (git submodule): its
#                         transport/ (CoAP, OSCORE, SPAKE2+, mDNS) is what
#                         the runtime tests talk to the device with, its
#                         run_sequences.py plays the template (see CI)
#   tests/conformance/    this stack's override files for the tool
#
# With pytest's default "prepend" import mode the directory inserted into
# sys.path is the test file's OWN directory, so `from fixtures import ...`
# and `from transport.coap_client import ...` would not resolve. pythonpath
# (pytest >= 7) puts these directories on sys.path for every run:
#
#   .              tests/                -> conftest.py
#   common         tests/common/         -> fixtures
#   iot-test-tool  tests/iot-test-tool/  -> transport.*, interpreter.* (run records)
#
# KNX_TOOL_DIR, when set, is a normal checkout of the tool used instead of
# the submodule (tests/conftest.py puts it first on sys.path).
pythonpath = . common iot-test-tool

# Keep a bare `pytest tests/` on the runtime tier: tests/unit is Google Test
# (C++), tests/fuzz is libFuzzer (C), and the tool's own tests run in its
# repository.
testpaths = runtime

# Markers used by the runtime tier.
markers =
    eitt_overlap: overlaps EITT template case(s); asserts more than the template does, kept deliberately
