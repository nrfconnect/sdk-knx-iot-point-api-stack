# Branch pipelines only. The jobs below carry no rules and therefore exist only
# in branch and tag pipelines, but the memcheck jobs' catch-all `when: manual`
# rule also matched merge request pipelines, which then contained nothing but
# those two jobs and failed validation with "needs 'build-gcc' ... does not
# exist". A merge request shows the branch pipeline of its source branch.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

stages:
  - build
  - test
  - device-test

variables:
  GIT_STRATEGY: clone
  # Shallow clone: the jobs use no git history, except quality-code, which
  # sets its own GIT_DEPTH: 0 for its diff check against the default branch.
  GIT_DEPTH: 1
  GIT_SUBMODULE_STRATEGY: none

default:
  image: itgesellschaft/knxiot-knx-ci:latest
  before_script:
    - git config --global protocol.file.allow always

# ==========================================================
# Job naming: <tier>-<toolchain or variant>
#   build-*            compile only
#   unit-*             GoogleTest suite (tests/unit)
#   fuzz-*             libFuzzer harnesses (tests/fuzz)
#   runtime-*          hand-written device tier (tests/runtime), needs a DUT
#   conformance-*      the conformance-test template played against the DUT by the
#                      test tool (submodule tests/iot-test-tool, a pinned commit of
#                      knx-iot-point-api-test-tool; its own tests run in its pipeline)
#   *-memcheck         the DUT built with ASan+UBSan; pass = no sanitizer report,
#                      the pytest tally is informational (a slower DUT may fail
#                      timing-sensitive steps; the first local run matched gcc)
#   *-massif           the DUT under Valgrind Massif: heap peak and its sites
#                      (nightly; the pytest tally is informational)
#   quality-*          code checks (complexity, format, include cycles)
# ==========================================================

# ----------------------------------------------------------
# Shared script fragments (pulled in with !reference)
# ----------------------------------------------------------
.python-deps:
  script:
    # the test tool: its transport/ serves the runtime tier, its runner the
    # conformance jobs (GIT_SUBMODULE_STRATEGY stays none: no other
    # submodule is fetched). The clone's origin carries no credentials, so
    # the submodule is fetched with the job token; for a private tool
    # project the stack must be on its job token allowlist (tool project:
    # Settings > CI/CD > Job token permissions).
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "https://${CI_SERVER_HOST}/"
    - git submodule update --init tests/iot-test-tool
    - curl -sSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
    - python3 /tmp/get-pip.py --break-system-packages --quiet
    - python3 -m pip install --break-system-packages --quiet -r tests/common/requirements.txt -r tests/iot-test-tool/requirements.txt

# KNX's files for the conformance tests (template, comment scheme, key map),
# fetched from update.knx.org as EITT does into a cache the jobs share
# (the tool's interpreter/knx_files.py); asked at most once a day per cache.
.knx-files:
  variables:
    KNX_TOOL_CACHE: $CI_PROJECT_DIR/.knx-cache
  cache:
    key: knx-files
    paths:
      - .knx-cache/
  script:
    - (cd tests/iot-test-tool && python3 -m interpreter.knx_files update > /dev/null) || echo "update.knx.org not reachable, using the cache"
    - (cd tests/iot-test-tool && python3 -m interpreter.knx_files show)

# Device network: the DUT lives in its OWN network namespace, the test tool
# stays in the root one, and a veth pair is the only link between them. This is
# the same setup as tests/common/tools/run-in-docker.ps1 and it matters twice:
#  * With both veth ends in one namespace the DUT learns the tool's address from
#    the SOURCE address of our discovery reply, the kernel picks a local address
#    for that, and the DUT then sends unicast s-mode telegrams to itself
#    (5.4.1.4 / 5.4.1.15). Distinct prefixes and host routes do not fix that;
#    only real namespace separation does.
#  * A veth pair comes up link-local only (fe80::/10). KNX_MULTICAST_SCOPE is 5
#    (site-local) on both sides and oc_init_read_next() refuses to send any
#    device-originated s-mode message until the network scope is >= site-local,
#    so each end also gets a unique local address (fd00::/8, RFC 4193).
# The multicast route on both ends is needed because mdns_listen_sock6 sends
# with sin6_scope_id=0 and the kernel has no default IPv6 multicast route here.
.device-network:
  script:
    - apt-get update -qq && apt-get install -y -qq iproute2 > /dev/null 2>&1
    - ip netns add dut
    - ip link add veth-dut type veth peer name veth-test
    - ip link set veth-dut netns dut
    - ip link set veth-test up
    - ip netns exec dut ip link set lo up
    - ip netns exec dut ip link set veth-dut up
    - ip netns exec dut sysctl -w net.ipv6.conf.veth-dut.disable_ipv6=0
    - sysctl -w net.ipv6.conf.veth-test.disable_ipv6=0
    - sleep 3
    - ip netns exec dut ip -6 route add ff00::/8 dev veth-dut || true
    - ip -6 route add ff00::/8 dev veth-test || true
    - ip netns exec dut ip -6 addr add ${DUT_ADDR}/64 dev veth-dut nodad || true
    - ip -6 addr add ${TOOL_ADDR}/64 dev veth-test nodad || true
    - sleep 1
    - echo "DUT ${DUT_ADDR} (netns dut, veth-dut) <-> tool ${TOOL_ADDR} (veth-test)"

# Common settings of every job that drives a device. The runner needs the
# `runtimetests` tag (privileged: creates a network namespace and a veth pair).
# The environment mirrors run-in-docker.ps1 so CI and local Docker runs are
# comparable one to one.
# `needs` lets these jobs start as soon as build-gcc has passed instead of
# waiting for the whole test stage (the fuzz job alone runs ~12 min); they
# build their own DUT and need no artifacts from anyone. The stage is kept
# for the pipeline view only.
.device-test:
  stage: device-test
  tags:
    - runtimetests
  needs:
    - job: build-gcc
      artifacts: false
  dependencies: []
  variables:
    DUT_ADDR: "fd11:9988:7766::1"
    TOOL_ADDR: "fd11:9988:7766::2"
    RUNTIME_TEST_SERVER_PREFIX: "ip netns exec dut"
    DUT_IFACE: veth-dut
    DEVICE_HOST: "fd11:9988:7766::1"
    DEVICE_IFACE: veth-test
    COAP_TIMEOUT: "5"
    SERVER_STARTUP_TIMEOUT: "30"
    RUNTIME_TEST_QUIET: "1"
    RUNTIME_TEST_TIME_SCALE: "0.05"

# Memory-safety variants run on the nightly schedule ONLY. They are the slowest
# jobs here (a full device tier against an ASan DUT), so they must never gate
# a push pipeline. A manual
# job still counts towards the pipeline status (blocked/warning), which is why
# there is no `when: manual` fallback: on every other pipeline the jobs simply
# do not exist. Run them on demand from the schedule page, or locally with
# tests/common/tools/run-in-docker.ps1 -Preset linux-test-asan.
.nightly:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      allow_failure: true

# ----------------------------------------------------------
# lint: commit messages
# Every non-merge commit of a branch that is not yet on the default branch
# must follow Conventional Commits (CONTRIBUTING.md, "Commit messages").
# With "Pipeline must succeed" a non-conforming branch cannot be merged.
# Not run on the default branch itself, on tags or on the nightly schedule.
# The job needs history: the default branch is fetched with the job token
# (the clone's origin carries no credentials, see .python-deps).
# ----------------------------------------------------------
commit-lint:
  stage: build
  needs: []
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  script:
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "https://${CI_SERVER_HOST}/"
    - git fetch --no-tags origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
    - python3 scripts/check_commit_messages.py --range "origin/${CI_DEFAULT_BRANCH}..HEAD"

# ----------------------------------------------------------
# build
# ----------------------------------------------------------
build-gcc:
  stage: build
  script:
    - cmake --preset=linux-debug-gcc
    - cmake --build --preset=linux-debug-gcc
  artifacts:
    access: developer
    paths:
      - build/linux-debug-gcc/apps
    expire_in: 1 week

# The publisher-off configuration (OC_PUBLISHER_TABLE_ENABLED=OFF, "plain
# sender") with an empty KNX_GPT_MAX_ENTRIES, as on Zephyr and ESP-IDF;
# compile only. The unit tests run it in tests/unit/publisher_off.
build-plain-sender:
  stage: build
  script:
    - cmake --preset=linux-plain-sender-gcc
    - cmake --build --preset=linux-plain-sender-gcc
  dependencies: []

# The CMake option OC_CLIENT_ENABLED=OFF (server only), as on Zephyr and
# ESP-IDF with CONFIG_KNXIOT_CLIENT=n; compile only. The unit tests run the
# stack without OC_CLIENT in tests/unit/client_off.
build-server-only:
  stage: build
  script:
    - cmake --preset=linux-server-only-gcc
    - cmake --build --preset=linux-server-only-gcc
  dependencies: []

# ----------------------------------------------------------
# test: unit
# ----------------------------------------------------------
unit-gcc:
  stage: test
  script:
    - cmake --preset=linux-test-gcc
    - cmake --build --preset=linux-test-gcc
    - ctest --preset=linux-test-gcc --output-junit report.xml
  artifacts:
    access: developer
    when: always
    reports:
      junit: build/linux-test-gcc/report.xml
  dependencies: []

unit-asan:
  stage: test
  script:
    - cmake --preset=linux-test-asan
    - cmake --build --preset=linux-test-asan
    - ctest --preset=linux-test-asan --output-junit report.xml
  artifacts:
    access: developer
    when: always
    reports:
      junit: build/linux-test-asan/report.xml
  dependencies: []

# The same suite built with clang: its UBSan checks things GCC's does not (e.g.
# arithmetic on a NULL pointer), so a defect of that kind fails here only.
unit-asan-clang:
  stage: test
  script:
    # libclang-rt-19-dev provides the asan/ubsan runtime archives the clang package lacks
    - apt-get update -qq && apt-get install -y -qq clang libclang-rt-19-dev > /dev/null 2>&1
    - cmake --preset=linux-test-asan-clang
    - cmake --build --preset=linux-test-asan-clang
    - ctest --preset=linux-test-asan-clang --output-junit report.xml
  artifacts:
    access: developer
    when: always
    reports:
      junit: build/linux-test-asan-clang/report.xml
  dependencies: []

# ----------------------------------------------------------
# test: unit function coverage (gcov via gcovr)
# The same GoogleTest suite built with --coverage -O0 (ENABLE_COVERAGE). The
# filters keep the number honest: this project's own code under src/resources/,
# src/core/, src/messaging/, src/security/ and src/util/, not tests/ or fetched dependencies,
# not the vendored src/util/c-timestamp parser, not src/resources/ri/oc_test_control.c (the test
# endpoints of the runtime/conformance device, built into kisTestControl only).
# The percentage shows on the job
# and in the merge request; the HTML report is an artifact.
# Branch coverage says more about the error paths than lines do (an untested
# `if (len > max) return error;` is a covered line but an untaken branch).
# The summary prints it; --fail-under-branch is a floor just below the
# current value (63.1 %, 2026-11-13), so a change that drops tested error
# paths fails here. Raise the floor when the value has grown.
# ----------------------------------------------------------
unit-coverage-gcc:
  stage: test
  script:
    - !reference [.python-deps, script]
    - python3 -m pip install --break-system-packages --quiet gcovr
    - cmake --preset=linux-coverage-gcc
    - cmake --build --preset=linux-coverage-gcc
    - ctest --preset=linux-coverage-gcc --output-junit report.xml
    - mkdir -p build/linux-coverage-gcc/coverage-html
    - >
      gcovr --root .
      --filter 'src/resources/' --filter 'src/core/' --filter 'src/messaging/' --filter 'src/security/' --filter 'src/util/'
      --exclude 'src/util/c-timestamp/.*' --exclude 'src/resources/ri/oc_test_control[.]c'
      --cobertura build/linux-coverage-gcc/coverage.xml
      --html-medium-threshold 65
      --html-high-threshold 85
      --html-details build/linux-coverage-gcc/coverage-html/index.html
      --print-summary
      --fail-under-branch 62
      build/linux-coverage-gcc
  # gcovr --print-summary writes "functions: 91.2% (83 out of 91)"; the
  # TOTAL line only exists in its default table report, which is not printed here.
  coverage: '/^functions:\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    access: developer
    when: always
    paths:
      - build/linux-coverage-gcc/coverage-html/
    reports:
      junit: build/linux-coverage-gcc/report.xml
      coverage_report:
        coverage_format: cobertura
        path: build/linux-coverage-gcc/coverage.xml
    expire_in: 4 weeks
  dependencies: []

# ----------------------------------------------------------
# test: code quality of the change (lizard, clang-format)
# Function complexity: CCN, length and parameter count per function of the
# stack's own C code (tests/common/tools/lizard_report.py holds the paths and
# thresholds). The statistic fails nothing: the log lists the functions over
# a threshold and ends with the summary line, whose Fun Rt / nloc Rt are the
# trend to follow per release; the HTML and CSV reports are artifacts.
# On a branch other than the default one, two checks of the lines changed
# since the merge base then gate the job (both run, either fails it):
# - lizard_report.py --diff: a new function over a threshold, or a changed
#   one that got worse, fails; a touched one that got no better is a WARN.
# - clang-format-diff.py on git diff -M: the changed lines must match .clang-format;
#   untouched code is not checked, a moved file only on its changed lines. The diff it prints is the fix.
# Both need the history to the merge base, hence the full clone of this job
# only. lizard and clang-format are pinned so results stay comparable.
# ----------------------------------------------------------
quality-code:
  stage: test
  variables:
    GIT_DEPTH: 0
  script:
    - curl -sSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
    - python3 /tmp/get-pip.py --break-system-packages --quiet
    - python3 -m pip install --break-system-packages --quiet lizard==1.26.0 jinja2 clang-format==22.1.8
    - python3 tests/common/tools/lizard_report.py --out build/lizard
    - |
      if [ -n "$CI_COMMIT_BRANCH" ] && [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        git fetch --quiet origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
        base=$(git merge-base "origin/$CI_DEFAULT_BRANCH" HEAD)
        rc=0
        python3 tests/common/tools/lizard_report.py --diff "$base" || rc=1
        echo "clang-format of the changed lines:"
        # git diff -M without a pathspec: a moved file is compared with its old path, so only its changed lines count
        git diff -M -U0 --no-color "$base" | clang-format-diff.py -p1 \
          -regex '(?!src/util/c-timestamp/|include/util/pt/|src/port/mdns/mdns\.h$)(src|include)/.*\.[ch]' || rc=1
        exit $rc
      fi
  artifacts:
    access: developer
    when: always
    paths:
      - build/lizard/
    expire_in: 4 weeks
  dependencies: []
  needs: []

# ----------------------------------------------------------
# test: header include cycles (clang-tidy misc-header-include-cycle)
# A header that includes itself through other headers compiles only in one
# include order. The preset linux-include-cycle runs clang-tidy with only that
# check on every C file of the build; a cycle among the headers in src/ or
# include/ fails the build.
# ----------------------------------------------------------
quality-include-cycle:
  stage: test
  script:
    - apt-get update -qq && apt-get install -y -qq clang-tidy > /dev/null 2>&1
    - clang-tidy --version
    - cmake --preset=linux-include-cycle
    - cmake --build --preset=linux-include-cycle
  dependencies: []
  needs: []

# ----------------------------------------------------------
# test: fuzz seed replay (gating) + coverage
# Replays every generated seed exactly once (-runs=0) first: deterministic on
# purpose, so a random mutation seed can never fail a pipeline for an
# unrelated commit. Every seed that once crashed the stack stays in the corpus
# as its regression test, so this job is the gate for those fixes. Then, per
# target, mutates from that corpus for a short, fixed budget
# (FUZZ_COVERAGE_SECONDS) purely to grow line coverage - any crash found there
# is logged and kept as an artifact but does NOT fail the job (that is what the
# manual fuzz-explore job gates on).
# Also reports source coverage (gcov via gcovr, clang): how much of src/resources/,
# src/core/, src/messaging/, src/security/ and src/util/ the corpus plus the mutation burst reaches.
# Excludes tests/, third-party dependencies and the vendored src/util/c-timestamp.
# ----------------------------------------------------------
fuzz-seed-replay:
  stage: test
  variables:
    FUZZ_COVERAGE_SECONDS: "30"
  script:
    # llvm-19 provides llvm-cov-19 (gcovr's gcov-executable for clang's
    # --coverage output); the clang package alone does not install it.
    - apt-get update -qq && apt-get install -y -qq clang libclang-rt-19-dev llvm-19 > /dev/null 2>&1
    - curl -sSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
    - python3 /tmp/get-pip.py --break-system-packages --quiet
    - python3 -m pip install --break-system-packages --quiet gcovr
    - mkdir -p build/linux-fuzz-coverage-clang/coverage-html fuzz-coverage-crashes
    - cmake --preset=linux-fuzz-coverage-clang
    - cmake --build --preset=linux-fuzz-coverage-clang
    - |
      status=0
      ctest --preset=linux-fuzz-coverage-clang -L fuzz --output-junit build/linux-fuzz-coverage-clang/fuzz-report.xml || status=$?
      # every harness CMake registered (tests/fuzz/CMakeLists.txt), so a new one cannot be left out here
      targets=$(ctest --preset=linux-fuzz-coverage-clang -N -L fuzz | sed -n 's/^ *Test *#[0-9]*: \(fuzz_.*\)_seed$/\1/p')
      [ -n "$targets" ] || { echo "error: no fuzz targets registered in CTest"; exit 1; }
      cd build/linux-fuzz-coverage-clang/tests/fuzz
      for t in $targets; do
        dict=""; [ -f "dict/${t#fuzz_}.dict" ] && dict="-dict=dict/${t#fuzz_}.dict"
        "./$t" "corpus/${t#fuzz_}" $dict -max_total_time="$FUZZ_COVERAGE_SECONDS" -timeout=10 \
          -rss_limit_mb=2048 -artifact_prefix="../../../../fuzz-coverage-crashes/${t}-" \
          || echo "warning: $t found a crash during the coverage mutation burst - see fuzz-coverage-crashes/ (does not fail the job)"
      done
      cd -
      if ! gcovr --root . --gcov-executable 'llvm-cov-19 gcov' \
        --filter 'src/resources/' --filter 'src/core/' --filter 'src/messaging/' --filter 'src/security/' --filter 'src/util/' \
        --exclude 'src/util/c-timestamp/.*' --exclude 'src/resources/ri/oc_test_control[.]c' \
        --cobertura build/linux-fuzz-coverage-clang/coverage.xml \
        --html-medium-threshold 65 \
        --html-high-threshold 85 \
        --html-details build/linux-fuzz-coverage-clang/coverage-html/index.html \
        --print-summary build/linux-fuzz-coverage-clang; then
        status=1
      fi
      exit "$status"
  # gcovr --print-summary writes "functions: 91.2% (83 out of 91)"; the
  # TOTAL line only exists in its default table report, which is not printed here.
  coverage: '/^functions:\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    access: developer
    when: always
    paths:
      - build/linux-fuzz-coverage-clang/coverage-html/
      - fuzz-coverage-crashes/
    reports:
      junit: build/linux-fuzz-coverage-clang/fuzz-report.xml
      coverage_report:
        coverage_format: cobertura
        path: build/linux-fuzz-coverage-clang/coverage.xml
    expire_in: 4 weeks
  needs: []

# ----------------------------------------------------------
# test: fuzz mutation run (on demand)
# Start from the GitLab UI. Override FUZZ_SECONDS when triggering to change the
# budget per target. New inputs land in fuzz-findings/, crashes in
# fuzz-crashes/; add an interesting input to tests/fuzz/make_corpus.py to keep
# it as a permanent seed.
# ----------------------------------------------------------
fuzz-explore:
  stage: test
  when: manual
  allow_failure: true
  variables:
    FUZZ_SECONDS: "900"
  script:
    # libclang-rt-19-dev provides the compiler-rt static archives (asan/ubsan/fuzzer);
    # the clang package alone only installs the frontend, not these link-time archives.
    - apt-get update -qq && apt-get install -y -qq clang libclang-rt-19-dev > /dev/null 2>&1
    - cmake --preset=linux-fuzz-clang
    - cmake --build --preset=linux-fuzz-clang
    - |
      status=0
      mkdir -p fuzz-crashes
      targets=$(ctest --preset=linux-fuzz-clang -N -L fuzz | sed -n 's/^ *Test *#[0-9]*: \(fuzz_.*\)_seed$/\1/p')
      [ -n "$targets" ] || { echo "error: no fuzz targets registered in CTest"; exit 1; }
      for t in $targets; do
        seeds="build/linux-fuzz-clang/tests/fuzz/corpus/${t#fuzz_}"
        d="build/linux-fuzz-clang/tests/fuzz/dict/${t#fuzz_}.dict"
        dict=""; [ -f "$d" ] && dict="-dict=$d"
        mkdir -p "fuzz-findings/$t"
        "build/linux-fuzz-clang/tests/fuzz/$t" "fuzz-findings/$t" "$seeds" $dict \
          -max_total_time="$FUZZ_SECONDS" -timeout=10 -rss_limit_mb=2048 \
          -artifact_prefix=fuzz-crashes/ || status=1
      done
      exit $status
  artifacts:
    access: developer
    when: always
    paths:
      - fuzz-crashes/
      - fuzz-findings/
    expire_in: 4 weeks
  needs: []

# ----------------------------------------------------------
# device-test: runtime tier, gcc
# The hand-written behaviour tests (hardening, observe, state machines,
# everything KNX never wrote a TestCase for). tests/common/fixtures.py orders
# the modules. Expected: 253 passed / 5 environment skips.
# allow_failure: the device tiers depend on a tagged, privileged runner; a
# missing runner must not block the pipeline. Read the JUnit report.
# ----------------------------------------------------------
runtime-gcc:
  extends: .device-test
  allow_failure: true
  variables:
    RUNTIME_TEST_SERVER: build/linux-test-gcc/tests/runtime_test_server
  script:
    - !reference [.device-network, script]
    - cmake --preset=linux-test-gcc -DOC_DEBUG_ENABLED=OFF -DOC_PRINT_ENABLED=OFF -DOC_DEBUG_OSCORE_ENABLED=OFF
    - cmake --build --preset=linux-test-gcc --target runtime_test_server
    - !reference [.python-deps, script]
    - python3 -m pytest tests/runtime/ -rfE -v --tb=short --junit-xml=build/linux-test-gcc/runtime-report.xml
  artifacts:
    access: developer
    when: always
    reports:
      junit: build/linux-test-gcc/runtime-report.xml

# ----------------------------------------------------------
# device-test: conformance tier, gcc
# KNX's conformance template (from update.knx.org, see .knx-files) played
# against the DUT by the test tool's run_sequences.py (submodule
# tests/iot-test-tool), which starts and stops it.
# tests/conformance/overrides.yaml carries the skips (5.4.2, out of scope;
# 5.3.14.1, optional) and xfails, the same ones the local Docker runs use.
# One pytest item per EITT sequence (one per TestCollection, 9 items); like
# EITT a sequence runs on after a failed row and the item lists every case
# that did not pass. Expected: 8 passed / 1 xfailed (5.10: 5.10.1.2 and
# 5.10.1.4 are xfail cases; confirmed by pipeline 59132); the skipped cases (5.3.14.1, 5.4.2.x) are listed as SKIP
# inside the 5.3 and 5.4 items, which still pass.
# allow_failure: only because the job depends on the tagged runner; there is
# no known red left, so it can become gating whenever the runner is reliable.
#
# The run record (conformance.krr.jsonl, tests/iot-test-tool/docs/run-record-and-evaluator.md)
# is kept as an artifact: load it in the GUI, or re-judge it locally after a
# change to the evaluation without a device:
#   cd tests/iot-test-tool && python3 -m interpreter.reevaluate <record> --overrides ../conformance [--promote RULE]
# The record's engine is the tool's commit (KRR_ENGINE_SHA).
# The job re-evaluates its own record straight away. That must reproduce
# every verdict (exit 1 otherwise); a record that does not is useless for
# offline re-evaluation, so it fails the job even when pytest passed.
# conformance-reevaluate.txt also carries the report-mode rule tally.
# ----------------------------------------------------------
conformance-gcc:
  extends:
    - .device-test
    - .knx-files
  allow_failure: true
  variables:
    RUNTIME_TEST_SERVER: build/linux-test-gcc/tests/runtime_test_server
  script:
    - !reference [.device-network, script]
    - cmake --preset=linux-test-gcc -DOC_DEBUG_ENABLED=OFF -DOC_PRINT_ENABLED=OFF -DOC_DEBUG_OSCORE_ENABLED=OFF
    - cmake --build --preset=linux-test-gcc --target runtime_test_server
    - !reference [.python-deps, script]
    - !reference [.knx-files, script]
    - |
      status=0
      export KRR_ENGINE_SHA="$(git -C tests/iot-test-tool rev-parse HEAD)"
      python3 tests/iot-test-tool/run_sequences.py --dut-command "$RUNTIME_TEST_SERVER_PREFIX $RUNTIME_TEST_SERVER" --overrides tests/conformance -v --tb=short --junit-xml=build/linux-test-gcc/conformance-report.xml --run-record=build/linux-test-gcc/conformance.krr.jsonl || status=$?
      cd tests/iot-test-tool
      python3 -m interpreter.reevaluate ../../build/linux-test-gcc/conformance.krr.jsonl --overrides ../conformance --json ../../build/linux-test-gcc/conformance-reevaluate.json > ../../build/linux-test-gcc/conformance-reevaluate.txt || status=$?
      cat ../../build/linux-test-gcc/conformance-reevaluate.txt
      # the run in the tool's GUI, in the browser: Browse the job's
      # artifacts and open trace-viewer/view.html
      python3 -m web.trace_viewer ../../build/linux-test-gcc/conformance.krr.jsonl ../../build/linux-test-gcc/trace-viewer || true
      exit $status
  artifacts:
    access: developer
    when: always
    paths:
      - build/linux-test-gcc/conformance.krr.jsonl
      - build/linux-test-gcc/trace-viewer/
      - build/linux-test-gcc/conformance-reevaluate.txt
      - build/linux-test-gcc/conformance-reevaluate.json
    reports:
      junit: build/linux-test-gcc/conformance-report.xml
    expire_in: 4 weeks

# ----------------------------------------------------------
# device-test: memory-safety checks (nightly)
# Same two tiers against a DUT built with ASan+UBSan. The pytest tally is
# informational, not the verdict: a slower DUT may fail timing-sensitive steps
# without a device defect (in the first local run the EITT tally matched gcc
# exactly, 176/1/8/2 in 12:25). The job fails only on a sanitizer report:
#   ERROR: AddressSanitizer   memory error (abort_on_error=1 also kills the DUT)
#   runtime error:            UBSan
# LeakSanitizer output is counted and printed but does not fail the job: a
# benign 1-byte SPAKE shutdown leak remains (oc_oscore_set_auth_shared,
# src/resources/knx/oc_knx_sec.c). The UBSan nonnull-attribute reports for
# memcpy/memcmp/memchr with a NULL pointer and length 0 were F-025, fixed
# (git log -p -S F-025 -- tests/FINDINGS.md).
# The DUT's stderr reaches the log through the
# [server-err] lines of tests/common/fixtures.py; -s keeps pytest from
# capturing them.
# ----------------------------------------------------------
.memcheck:
  extends:
    - .device-test
    - .nightly
    - .knx-files
  allow_failure: true
  variables:
    RUNTIME_TEST_SERVER: build/linux-test-asan/tests/runtime_test_server
    ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
    UBSAN_OPTIONS: "print_stacktrace=1"
  script:
    - !reference [.device-network, script]
    - cmake --preset=linux-test-asan -DOC_DEBUG_ENABLED=OFF -DOC_PRINT_ENABLED=OFF -DOC_DEBUG_OSCORE_ENABLED=OFF
    - cmake --build --preset=linux-test-asan --target runtime_test_server
    - !reference [.python-deps, script]
    - !reference [.knx-files, script]
    - eval "$MEMCHECK_COMMAND -rfE -v -s --tb=short --junit-xml=build/linux-test-asan/${MEMCHECK_NAME}-report.xml" 2>&1 | tee build/linux-test-asan/${MEMCHECK_NAME}-memcheck.log || true
    - |
      log=build/linux-test-asan/${MEMCHECK_NAME}-memcheck.log
      leaks=$(grep -c 'ERROR: LeakSanitizer' "$log" || true)
      echo "LeakSanitizer reports (informational): $leaks"
      if grep -E 'ERROR: AddressSanitizer|runtime error:' "$log"; then
        echo "memcheck FAILED: sanitizer report in the DUT output (see above)"
        exit 1
      fi
      echo "memcheck OK: no AddressSanitizer / UBSan report"
  artifacts:
    access: developer
    when: always
    paths:
      - build/linux-test-asan/${MEMCHECK_NAME}-memcheck.log
    reports:
      junit: build/linux-test-asan/${MEMCHECK_NAME}-report.xml

runtime-asan-memcheck:
  extends: .memcheck
  variables:
    MEMCHECK_NAME: runtime
    MEMCHECK_COMMAND: python3 -m pytest tests/runtime/

conformance-asan-memcheck:
  extends: .memcheck
  variables:
    MEMCHECK_NAME: conformance
    MEMCHECK_COMMAND: python3 tests/iot-test-tool/run_sequences.py --dut-command "ip netns exec dut build/linux-test-asan/tests/runtime_test_server" --overrides tests/conformance

# ----------------------------------------------------------
# device-test: heap peak (nightly)
# The DUT (the same build as runtime-gcc) under Valgrind Massif while a device
# tier plays against it. ms_print turns each profile into <tier>.<pid>.txt:
# the heap over time with its peak (its head goes to the log) and the
# allocation trees of the detailed snapshots. The stack's allocation wrappers
# are --alloc-fn, so a site in a tree is the code that asked for the memory.
# Figures are 64-bit host values (8 B pointers): follow them as a trend, the
# 32-bit target model is docs/memory_breakdown.md, section 7. Massif slows the
# DUT down, so the CoAP, start-up and stop timeouts are longer than in
# runtime-gcc; the pytest tally is informational, the job fails only without
# a profile. Profiles and reports are artifacts.
# Locally: run-in-docker.ps1 -Massif (run-in-docker.sh --massif).
# ----------------------------------------------------------
.massif:
  extends:
    - .device-test
    - .nightly
    - .knx-files
  allow_failure: true
  variables:
    RUNTIME_TEST_SERVER: build/linux-test-gcc/tests/runtime_test_server
    MASSIF: "valgrind --tool=massif --alloc-fn=oc_mmem_alloc --alloc-fn=_oc_new_string --alloc-fn=_oc_new_byte_string --alloc-fn=_oc_alloc_string --alloc-fn=_oc_new_array --alloc-fn=_oc_alloc_string_array"
    COAP_TIMEOUT: "20"
    SERVER_STARTUP_TIMEOUT: "120"
    SERVER_STOP_TIMEOUT: "60"
  script:
    - !reference [.device-network, script]
    - apt-get install -y -qq valgrind > /dev/null 2>&1
    - cmake --preset=linux-test-gcc -DOC_DEBUG_ENABLED=OFF -DOC_PRINT_ENABLED=OFF -DOC_DEBUG_OSCORE_ENABLED=OFF
    - cmake --build --preset=linux-test-gcc --target runtime_test_server
    - !reference [.python-deps, script]
    - !reference [.knx-files, script]
    - mkdir -p build/massif
    - eval "$MASSIF_COMMAND -rfE -v --tb=short --junit-xml=build/massif/${MASSIF_NAME}-report.xml" 2>&1 | tee build/massif/${MASSIF_NAME}.log || true
    - ls build/massif/${MASSIF_NAME}.*.out
    - for f in build/massif/${MASSIF_NAME}.*.out; do ms_print "$f" > "${f%.out}.txt"; head -n 34 "${f%.out}.txt"; done
  artifacts:
    access: developer
    when: always
    paths:
      - build/massif/
    reports:
      junit: build/massif/${MASSIF_NAME}-report.xml
    expire_in: 4 weeks

runtime-massif:
  extends: .massif
  variables:
    MASSIF_NAME: runtime
    MASSIF_COMMAND: RUNTIME_TEST_SERVER_PREFIX="ip netns exec dut $MASSIF --massif-out-file=build/massif/runtime.%p.out" python3 -m pytest tests/runtime/

conformance-massif:
  extends: .massif
  variables:
    MASSIF_NAME: conformance
    MASSIF_COMMAND: python3 tests/iot-test-tool/run_sequences.py --dut-command "ip netns exec dut $MASSIF --massif-out-file=build/massif/conformance.%p.out build/linux-test-gcc/tests/runtime_test_server" --overrides tests/conformance
